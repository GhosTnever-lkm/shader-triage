name: Test and package ShaderTriage

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Check release versions
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          node -e "const p=require('./package.json'); if(p.version !== process.argv[1]) process.exit(1)" "$VERSION"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Create release archive
        run: |
          mkdir -p dist
          zip -qr "dist/ShaderTriage-${GITHUB_REF_NAME}.zip" index.html styles.css assets js demo-logs README.md CHANGELOG.md LICENSE
          cd dist
          sha256sum "ShaderTriage-${GITHUB_REF_NAME}.zip" > "ShaderTriage-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ShaderTriage $GITHUB_REF_NAME" --generate-notes
